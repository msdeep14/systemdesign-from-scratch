version: '3.8'

services:
  web:
    build: .
    restart: always
    # Override port to 5432 just for migrations to bypass PgBouncer (transaction mode breaks migrations)
    command: >
      bash -c "POSTGRES_PORT=5432 python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 30 --timeout 120 bses.wsgi:application"
    volumes:
      - .:/app
    expose:
      - "8000"
    ports:
      - "8000:8000" # Expose to host so Load Balancer can route to it
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    logging:
      driver: awslogs
      options:
        awslogs-region: "${AWS_REGION}"
        awslogs-group: "photoz-app-logs"
        awslogs-stream: "app-node-${NODE_IP}"
        awslogs-create-group: "true"
    env_file:
      - .env
    environment:
      - POSTGRES_PORT=6432

  consul-agent:
    image: hashicorp/consul:latest
    # Host networking is strictly required so the agent registers the true EC2 Private IP
    # with the Load Balancer, rather than an unreachable internal Docker IP like 172.18.0.5.
    network_mode: "host"
    volumes:
      - ./consul/web.json:/consul/config/web.json:ro
    command: ["agent", "-retry-join=${CONSUL_SERVER_IP}", "-bind={{ GetPrivateInterfaces | attr \"address\" }}"]
