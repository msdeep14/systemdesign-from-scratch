services:
  db:
    image: postgres:15
    command: ["postgres", "-c", "max_connections=20", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: bses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  redis-primary:
    image: redis:7
    container_name: photoz-redis-primary
    command: ["redis-server", "--protected-mode", "no"]
    ports:
      - "6379:6379"

  redis-replica-1:
    image: redis:7
    container_name: photoz-redis-replica-1
    command: ["redis-server", "--replicaof", "redis-primary", "6379", "--protected-mode", "no"]
    depends_on:
      - redis-primary
    ports:
      - "6380:6379"

  redis-replica-2:
    image: redis:7
    container_name: photoz-redis-replica-2
    command: ["redis-server", "--replicaof", "redis-primary", "6379", "--protected-mode", "no"]
    depends_on:
      - redis-primary
    ports:
      - "6381:6379"

  redis-replica-3:
    image: redis:7
    container_name: photoz-redis-replica-3
    command: ["redis-server", "--replicaof", "redis-primary", "6379", "--protected-mode", "no"]
    depends_on:
      - redis-primary
    ports:
      - "6382:6379"

  sentinel-1:
    image: redis:7
    container_name: photoz-sentinel-1
    command: ["sh", "-c", "cp /tmp/sentinel.conf /tmp/sentinel_run.conf && redis-sentinel /tmp/sentinel_run.conf"]
    volumes:
      - ./redis-sentinel/sentinel.conf:/tmp/sentinel.conf:ro
    depends_on:
      - redis-primary
    ports:
      - "26379:26379"

  sentinel-2:
    image: redis:7
    container_name: photoz-sentinel-2
    command: ["sh", "-c", "cp /tmp/sentinel.conf /tmp/sentinel_run.conf && redis-sentinel /tmp/sentinel_run.conf"]
    volumes:
      - ./redis-sentinel/sentinel.conf:/tmp/sentinel.conf:ro
    depends_on:
      - redis-primary
    ports:
      - "26380:26379"

  sentinel-3:
    image: redis:7
    container_name: photoz-sentinel-3
    command: ["sh", "-c", "cp /tmp/sentinel.conf /tmp/sentinel_run.conf && redis-sentinel /tmp/sentinel_run.conf"]
    volumes:
      - ./redis-sentinel/sentinel.conf:/tmp/sentinel.conf:ro
    depends_on:
      - redis-primary
    ports:
      - "26381:26379"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    depends_on:
      - db

  web:
    build: .
    restart: always
    # Override port to 5432 and host to db just for migrations to bypass PgBouncer (transaction mode breaks migrations)
    command: >
      bash -c "POSTGRES_HOST=db POSTGRES_PORT=5432 python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 5 --timeout 120 bses.wsgi:application"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=pgbouncer
      - POSTGRES_PORT=6432
      - REPLICA_DB_HOST=pgbouncer-replica
      - REPLICA_DB_PORT=6432
      - REDIS_SENTINELS=sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      - REDIS_MASTER_NAME=mymaster
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - db
      - pgbouncer
      - pgbouncer-replica
      - redis-primary
      - sentinel-1
      - kafka

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./nginx/nginx.conf.local:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - web

  db-replica:
    image: postgres:15
    environment:
      PRIMARY_DB_HOST: db
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./postgres-replica/docker-entrypoint-replica.sh:/docker-entrypoint-replica.sh:ro
    entrypoint: ["bash", "/docker-entrypoint-replica.sh"]
    command: ["postgres", "-c", "max_connections=20"]
    depends_on:
      - db
    ports:
      - "5433:5432"

  pgbouncer-replica:
    image: edoburu/pgbouncer:latest
    volumes:
      - ./pgbouncer/pgbouncer-replica.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6433:6432"
    depends_on:
      - db-replica

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  postgres_data:
  static_volume:
  postgres_replica_data:
  kafka_data:
