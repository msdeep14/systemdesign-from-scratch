version: '3.8'

services:
  db:
    image: postgres:15
    command: ["postgres", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: bses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_NAME=bses
      # AUTH_TYPE=plain resolves a mismatch where Postgres 15 expects scram-sha-256.
      # Safe for PhotoZ as traffic is isolated within private VPC/Docker networks.
      # Recommendation: For strict Zero Trust compliance, use scram-sha-256 and enforce TLS.
      - AUTH_TYPE=plain
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=10
      - LISTEN_PORT=6432
    ports:
      - "6432:6432"
    depends_on:
      - db

  web:
    build: .
    command: >
      bash -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 --workers 5 --threads 10 bses.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 200M
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=pgbouncer
      - POSTGRES_PORT=6432
    depends_on:
      - db
      - pgbouncer

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./nginx/nginx.conf.local:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
