version: '3.8'

services:
  db:
    image: postgres:15
    command: ["postgres", "-c", "max_connections=20", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: bses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    depends_on:
      - db

  web:
    build: .
    restart: always
    # Override port to 5432 and host to db just for migrations to bypass PgBouncer (transaction mode breaks migrations)
    command: >
      bash -c "POSTGRES_HOST=db POSTGRES_PORT=5432 python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 5 --timeout 120 bses.wsgi:application"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=pgbouncer
      - POSTGRES_PORT=6432
      - REPLICA_DB_HOST=pgbouncer-replica
      - REPLICA_DB_PORT=6432
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - pgbouncer
      - pgbouncer-replica
      - redis

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./nginx/nginx.conf.local:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - web

  db-replica:
    image: postgres:15
    environment:
      PRIMARY_DB_HOST: db
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./postgres-replica/docker-entrypoint-replica.sh:/docker-entrypoint-replica.sh:ro
    entrypoint: ["bash", "/docker-entrypoint-replica.sh"]
    command: ["postgres", "-c", "max_connections=20"]
    depends_on:
      - db
    ports:
      - "5433:5432"

  pgbouncer-replica:
    image: edoburu/pgbouncer:latest
    volumes:
      - ./pgbouncer/pgbouncer-replica.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6433:6432"
    depends_on:
      - db-replica

volumes:
  postgres_data:
  static_volume:
  postgres_replica_data:
