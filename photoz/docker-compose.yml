version: '3.8'

services:
  db:
    image: postgres:15
    command: ["postgres", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: bses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    depends_on:
      - db

  web:
    build: .
    restart: always
    # Override port to 5432 and host to db just for migrations to bypass PgBouncer (transaction mode breaks migrations)
    command: >
      bash -c "POSTGRES_HOST=db POSTGRES_PORT=5432 python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 5 --timeout 120 bses.wsgi:application"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=pgbouncer
      - POSTGRES_PORT=6432
    depends_on:
      - db
      - pgbouncer

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./nginx/nginx.conf.local:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
