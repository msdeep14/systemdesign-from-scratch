{% extends 'base.html' %}

{% block title %}Server Error - BSES{% endblock %}

{% block content %}
<div class="error-container" style="text-align: center; padding: 4rem 2rem;">
    <h1 style="color: var(--danger); font-size: 4rem; margin-bottom: 1rem;">500</h1>
    <h2>Server Error</h2>
    <p class="text-muted">Oops! Something went wrong on our end while processing your request.</p>
    <p><strong>Our engineering team has been alerted, and we're working on it to fix!</strong></p>
    <a href="{% url 'newsfeed' %}" class="btn btn-primary" style="margin-top: 2rem;">Go to Homepage</a>
</div>
{% endblock %}
