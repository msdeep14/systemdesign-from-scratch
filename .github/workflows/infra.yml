name: Infrastructure CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - 'iaac/aws/terraform/**'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'iaac/aws/terraform/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: iaac/aws/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Determine Workspace
        id: workspace
        run: |
          if [ "${{ github.base_ref }}" == "main" ]; then
            echo "WORKSPACE=default" >> $GITHUB_ENV
          else
            echo "WORKSPACE=staging" >> $GITHUB_ENV
          fi

      - name: Terraform Plan
        id: plan
        run: |
          # Write the Terraform variables from GitHub Secrets
          echo "${{ secrets.TF_VARS }}" > terraform.tfvars
          
          # Select workspace based on target branch
          terraform workspace select $WORKSPACE || terraform workspace new $WORKSPACE
          
          # Run the plan
          terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Update PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    defaults:
      run:
        working-directory: iaac/aws/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Determine Workspace
        id: workspace
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "WORKSPACE=default" >> $GITHUB_ENV
          else
            echo "WORKSPACE=staging" >> $GITHUB_ENV
          fi

      - name: Terraform Apply
        run: |
          echo "${{ secrets.TF_VARS }}" > terraform.tfvars
          terraform workspace select $WORKSPACE || terraform workspace new $WORKSPACE
          terraform apply -auto-approve
