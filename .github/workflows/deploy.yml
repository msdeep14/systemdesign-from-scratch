name: Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bses_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: photoz
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: photoz
        env:
          DJANGO_SETTINGS_MODULE: bses.settings
          POSTGRES_DB: bses_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          USE_S3: "False"
          SECRET_KEY: ci-test-secret-key-not-used-in-production
          DEBUG_MODE: "True"
        run: python manage.py test --verbosity=2

  migrate:
    name: Run migrations
    runs-on: self-hosted
    needs: test
    # Only deploy from main branch
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          echo "${{ secrets.APP_NODE_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Run migrations on one app node
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Dynamically get the private IP of one running app node
          APP_NODE_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:autoscaling:groupName,Values=photoz-app-asg" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" \
            --output text)
            
          if [ "$APP_NODE_IP" == "None" ] || [ -z "$APP_NODE_IP" ]; then
            echo "No running app instances found in ASG!"
            exit 1
          fi

          echo "Running migrations on node: $APP_NODE_IP"
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              ubuntu@$APP_NODE_IP \
              "cd /home/ubuntu/systemdesign-from-scratch/photoz && \
               git pull origin main && \
               POSTGRES_PORT=5432 docker compose -f docker-compose-app.yml run --rm web python manage.py migrate"




  deploy:
    name: Deploy via ASG Instance Refresh
    runs-on: self-hosted
    needs: migrate

    steps:

      - name: Start Instance Refresh
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name photoz-app-asg \
            --preferences MinHealthyPercentage=50,InstanceWarmup=120
