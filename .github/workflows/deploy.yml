name: Deploy

on:
  push:
    branches:
      - main
      - staging

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        working-directory: photoz
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff lint
        working-directory: photoz
        run: ruff check .

      - name: Run ruff format check
        working-directory: photoz
        run: ruff format --check .

      - name: Run pylint
        working-directory: photoz
        run: |
          pylint \
            --load-plugins=pylint_django \
            --django-settings-module=bses.settings \
            $(find . -name "*.py" -not -path "*/migrations/*" -not -path "*/venv/*")

      - name: Run import linter
        working-directory: photoz
        run: PYTHONPATH=. lint-imports

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          # As this is temporary postgres container for running tests
          # we took a call to keep the credentials here.
          # Other approach is keeping these credentials in GitHub secrets.
          POSTGRES_DB: bses_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: photoz
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: photoz
        env:
          DJANGO_SETTINGS_MODULE: bses.settings
          POSTGRES_DB: bses_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          USE_S3: "False"
          SECRET_KEY: ci-test-secret-key-not-used-in-production
          DEBUG_MODE: "True"
        run: python manage.py test --verbosity=2

  migrate:
    name: Run migrations
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run migrations on one app node via SSM
        run: |
          # Dynamically get the Instance ID of one running app node
          if [ "${{ github.ref_name }}" == "main" ]; then
            ASG_NAME="photoz-app-asg"
          else
            ASG_NAME="photoz-app-asg-staging"
          fi
          
          APP_NODE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:autoscaling:groupName,Values=$ASG_NAME" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
            
          if [ "$APP_NODE_ID" == "None" ] || [ -z "$APP_NODE_ID" ]; then
            echo "No running app instances found in ASG! Skipping migrations."
            exit 0
          fi

          echo "Running migrations via SSM on node: $APP_NODE_ID"
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$APP_NODE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["sudo -u ubuntu bash -c \"cd /home/ubuntu/systemdesign-from-scratch/photoz && git pull origin ${{ github.ref_name }} && POSTGRES_PORT=5432 docker compose -f docker-compose-app.yml run --rm web python manage.py migrate\""]}' \
            --query "Command.CommandId" \
            --output text)
            
          echo "Waiting for command $COMMAND_ID to complete..."
          # Wait up to 5 minutes (100 * 3 seconds default)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$APP_NODE_ID"
          
          # Print the output for debugging
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$APP_NODE_ID" --query "StandardOutputContent" --output text
          
          # Check status
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$APP_NODE_ID" --query "Status" --output text)
          if [ "$STATUS" != "Success" ]; then
            echo "Migration failed with status: $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$APP_NODE_ID" --query "StandardErrorContent" --output text
            exit 1
          fi

  deploy:
    name: Deploy via ASG Instance Refresh
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start Instance Refresh
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            ASG_NAME="photoz-app-asg"
          else
            ASG_NAME="photoz-app-asg-staging"
          fi
          
          APP_NODE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:autoscaling:groupName,Values=$ASG_NAME" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
            
          if [ "$APP_NODE_ID" == "None" ] || [ -z "$APP_NODE_ID" ]; then
            echo "No running app instances found in ASG. Skipping instance refresh."
            exit 0
          fi
          
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name $ASG_NAME \
            --preferences MinHealthyPercentage=50,InstanceWarmup=120
